name: Inbound Escalation Slash Commands

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created, edited]

jobs:
  # Example: /close command to close an issue with a label
  close:
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open' && github.event_name == 'issue_comment' && contains(github.event.comment.body, '/close')
    steps:
      - uses: actions/checkout@v4
      - name: Close issue
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['status::closed']
            });
            console.log('Closed issue #' + context.payload.issue.number);

  # Example: /label command to add labels
  label:
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open' && github.event_name == 'issue_comment' && contains(github.event.comment.body, '/label')
    steps:
      - uses: actions/checkout@v4
      - name: Parse and apply labels
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.comment.body;
            const match = body.match(/\/label\s+(.+)/i);
            if (!match) {
              core.info('No labels found in /label command');
              return;
            }
            const labels = match[1].split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels
            });
            console.log('Added labels:', labels);
