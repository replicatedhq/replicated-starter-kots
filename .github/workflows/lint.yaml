name: Lint

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'replicated/**'
      - 'script/**'
      - 'Makefile'
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint charts/app/

      - name: Validate Replicated manifests
        run: |
          # Basic YAML validation
          yq e 'true' replicated/*.yaml > /dev/null
        if: hashFiles('replicated/*.yaml') != ''

      - name: Run shellcheck on scripts
        run: |
          for script in bin/setup.sh script/*; do
            if [ -f "$script" ] && head -1 "$script" | grep -q 'bash\|sh'; then
              shellcheck "$script"
            fi
          done
        continue-on-error: true
